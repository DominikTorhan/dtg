<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artillery · DTG Games</title>
  <link rel="stylesheet" href="../../style.css">
  <script src="../../gate.js"></script>
  <style>
    #field {
      display: block;
      width: 100%;
      aspect-ratio: 640 / 400;
      background: linear-gradient(#1b2433, #12141a);
      border-radius: var(--radius);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 440px;
      margin: 12px auto 0;
    }
    .pad button { padding: 14px 0; background: var(--panel); color: var(--fg); touch-action: manipulation; }
    .pad button.fire { background: var(--danger); color: #fff; }
    .status { text-align: center; min-height: 1.5em; margin: 8px 0 0; }
    .controls { text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a href="../../">&larr; All games</a>
      <div class="hud">
        <span>Level <b id="level">1</b></span>
        <span>Wind <b id="wind">0</b></span>
        <span>Best <b id="best">–</b></span>
      </div>
    </div>
    <canvas id="field" width="640" height="400"></canvas>
    <p class="status" id="status"></p>
    <div class="pad" aria-label="Controls">
      <button data-act="left" aria-label="Walk left">&#9664;</button>
      <button data-act="up" aria-label="Aim up">&#9650;</button>
      <button data-act="down" aria-label="Aim down">&#9660;</button>
      <button data-act="right" aria-label="Walk right">&#9654;</button>
      <button data-act="fire" class="fire" aria-label="Hold to charge, release to fire">Fire</button>
    </div>
    <div class="controls">
      <button id="start">New game</button>
      <p class="hint">Your green team against the computer's orange team, one shot per turn.
        &larr; &rarr; walk, &uarr; &darr; aim, hold Space to charge and release to fire.
        Watch the wind. Water is deadly.</p>
    </div>
  </main>
  <script src="artillery.js"></script>
</body>
</html>
