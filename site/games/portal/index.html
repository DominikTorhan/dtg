<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Run · DTG Games</title>
  <link rel="stylesheet" href="../../style.css">
  <script src="../../gate.js"></script>
  <style>
    main { max-width: 900px; }
    #screen {
      display: block;
      width: 100%;
      aspect-ratio: 320 / 192;
      background: #000;
      border-radius: 6px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .pad { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .pad div { display: flex; gap: 8px; }
    .pad button {
      width: 72px;
      padding: 16px 0;
      background: var(--panel);
      color: var(--fg);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .pad button.jump { width: 96px; background: var(--accent); color: #0b0d10; }
    .controls { text-align: center; margin-top: 8px; }
    .tag { font-size: 0.75rem; color: var(--accent-2); border: 1px solid var(--accent-2); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a href="../../">&larr; All games</a>
      <div class="hud">
        <span>Stage <b id="stage">1</b></span>
        <span>Coins <b id="coins">0</b></span>
        <span>Best <b id="best">–</b></span>
      </div>
    </div>
    <canvas id="screen" width="320" height="192"></canvas>
    <div class="pad" aria-label="Touch controls">
      <div>
        <button data-k="left" aria-label="Left">&#9664;</button>
        <button data-k="right" aria-label="Right">&#9654;</button>
      </div>
      <button data-k="jump" class="jump" aria-label="Jump">Jump</button>
    </div>
    <div class="controls">
      <p class="hint">&larr; &rarr; / A D run, Space / &uarr; / W jump (hold for higher). Stomp the crawlers,
        grab coins, reach the portal. P pause. <span class="tag">experimental</span></p>
    </div>
  </main>
  <script src="themes.js"></script>
  <script src="portal.js"></script>
</body>
</html>
