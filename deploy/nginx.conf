server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe for k8s.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
